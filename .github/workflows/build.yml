# ================================================================
#  MiraIsGod のビルド
#  ・プッシュしたとき (どのブランチでも) と、Actions のページの「Run workflow」で動く
#  ・できたものは、Actions の実行結果のページの「Artifacts」からダウンロードできる
#      MiraIsGod          … プラグインの DLL だけ
#      MiraIsGodInstaller … インストーラー (.exe)。DLL も中に入っている
#  ・エラーが出たときは、その行が「Annotations」(実行結果のページの上のほう) に出る
# ================================================================
name: Build MiraIsGod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      # 1) プラグイン (MiraIsGod.dll) を作る → out フォルダ
      - name: Build plugin
        run: |
          set +e
          dotnet build MiraIsGod.csproj -c Release -o out > build.log 2>&1
          code=$?
          grep -E "error|warn" build.log | sort -u | head -30 | while read -r l; do echo "::warning::$l"; done
          exit $code

      # 2) インストーラー (MiraIsGodInstaller.exe) を作る → out-installer フォルダ
      #    1) でできた DLL を、.exe の中に入れる
      - name: Build installer
        run: |
          set +e
          dotnet build Installer/MiraIsGodInstaller.csproj -c Release -o out-installer -p:PluginDll=../out/MiraIsGod.dll > inst.log 2>&1
          code=$?
          grep -E "error|warn" inst.log | sort -u | head -30 | while read -r l; do echo "::warning::$l"; done
          exit $code

      # 3) できたものを、ダウンロードできるようにする
      - uses: actions/upload-artifact@v4
        with:
          name: MiraIsGod
          path: out/MiraIsGod.dll

      - uses: actions/upload-artifact@v4
        with:
          name: MiraIsGodInstaller
          path: out-installer/MiraIsGodInstaller.exe
